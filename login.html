<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chattrix — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="logo">Chattrix</div>
      </div>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="communities.html">Communities</a>
        <a href="profile.html">Profile</a>
        <a href="about.html">About</a>
        <a href="login.html">Login</a>
      </nav>

      <div class="header-controls">
        <div class="theme-toggle" title="Toggle theme">🌙</div>
        <div class="menu-btn" title="Menu">☰</div>
      </div>
    </div>
  </header>

  <div class="mobile-nav">
    <a href="index.html">Home</a>
    <a href="explore.html">Explore</a>
    <a href="communities.html">Communities</a>
    <a href="profile.html">Profile</a>
    <a href="about.html">About</a>
    <a href="login.html">Login</a>
  </div>

  <main class="container">
    <section class="login-page">
      <div class="login-box card" style="max-width:420px;margin:40px auto;padding:28px;">
        <h2>Welcome Back</h2>
        <p style="color:var(--muted);margin-bottom:12px;">Sign in to continue to Chattrix</p>

        <input id="username" type="text" placeholder="Username" aria-label="username" style="width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid #333;background:transparent;color:var(--text);" />
        <input id="password" type="password" placeholder="Password" aria-label="password" style="width:100%;padding:10px;margin-bottom:14px;border-radius:8px;border:1px solid #333;background:transparent;color:var(--text);" />

        <button id="signinBtn" class="login-btn" type="button" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;">
          Sign In
        </button>

        <div style="margin-top:12px;color:var(--muted);font-size:14px;text-align:center;">
          Don't have an account? 
          <a href="index.html" style="color:var(--accent);font-weight:700;text-decoration:none;">Get started</a>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <p>© 2025 Chattrix — Stay Connected</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
